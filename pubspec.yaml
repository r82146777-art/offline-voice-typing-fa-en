name: offline_voice_typing
description: Offline voice typing app for Persian and English with strong accessibility support.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Speech recognition (Vosk)
  vosk_flutter: ^0.3.47   # یا نسخه جدیدتر در صورت وجود
  # Audio recording
  record: ^5.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  # Text-to-speech for feedback
  flutter_tts: ^4.0.2
  # State management (simple)
  provider: ^6.1.2
  # UI helpers
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/models/fa/
    - assets/models/en/
