name: offline_voice_typing
description: Offline voice typing for Persian and English with strong accessibility.
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  http: ^1.2.2
  archive: ^3.6.1
  flutter_tts: ^4.0.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  # برای نسخه بعدی وقتی اتصال واقعی انجام شد:
  # vosk_flutter: ^0.3.47
  # record: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
