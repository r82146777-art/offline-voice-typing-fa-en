name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          mkdir -p /tmp/backup
          cp -r lib pubspec.yaml README.md android_ime /tmp/backup/ 2>/dev/null || true
          rm -rf android ios linux macos windows web
          flutter create --org com.offlinevoicetyping --project-name offline_voice_typing --platforms=android .
          cp -r /tmp/backup/lib .
          cp /tmp/backup/pubspec.yaml .
          cp /tmp/backup/README.md . 2>/dev/null || true
          cp -r /tmp/backup/android_ime . 2>/dev/null || true

      - name: Inject native code, permissions, gradle
        run: |
          set -e
          PKG=android/app/src/main/kotlin/com/offlinevoicetyping/offline_voice_typing
          mkdir -p "$PKG" android/app/src/main/res/layout android/app/src/main/res/xml
          cp android_ime/VoskEngine.kt "$PKG/"
          cp android_ime/MainActivity.kt "$PKG/"
          cp android_ime/VoiceTypingIME.kt "$PKG/"
          cp android_ime/ime_keyboard.xml android/app/src/main/res/layout/
          cp android_ime/method.xml android/app/src/main/res/xml/

          python3 <<'PY'
          from pathlib import Path

          mpath = Path("android/app/src/main/AndroidManifest.xml")
          text = mpath.read_text()
          if "RECORD_AUDIO" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1,
              )
          if 'android:largeHeap' not in text:
              text = text.replace(
                  "<application",
                  '<application android:largeHeap="true" android:extractNativeLibs="true" ',
                  1,
              )
          if "VoiceTypingIME" not in text:
              service = '''
                  <service
                      android:name=".VoiceTypingIME"
                      android:label="Offline Voice Typing"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              '''
              text = text.replace("</application>", service + "\n    </application>")
          mpath.write_text(text)

          for name in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              gpath = Path(name)
              if not gpath.exists():
                  continue
              g = gpath.read_text()
              if "vosk-android" not in g:
                  if name.endswith(".kts"):
                      g = g.replace(
                          "dependencies {",
                          'dependencies {\n    implementation("com.alphacephei:vosk-android:0.3.70")',
                          1,
                      )
                  else:
                      g = g.replace(
                          "dependencies {",
                          'dependencies {\n    implementation "com.alphacephei:vosk-android:0.3.70"',
                          1,
                      )
              if "useLegacyPackaging" not in g:
                  extra = '''
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    ndk {
        abiFilters.clear()
        abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a"))
    }
'''
                  if name.endswith(".kts"):
                      g = g.replace("android {", "android {" + extra, 1)
                  else:
                      g = g.replace(
                          "android {",
                          'android {\n    packagingOptions { jniLibs { useLegacyPackaging true } }\n',
                          1,
                      )
              gpath.write_text(g)
              print("Updated", name)
          PY

      - name: Download official Vosk models into Android assets
        run: |
          set -e
          download_model() {
            local name="$1"
            shift
            local out="/tmp/${name}.zip"
            local ok=0
            for url in "$@"; do
              echo "Trying $url"
              if curl -fL --retry 4 --retry-delay 3 -o "$out" "$url"; then
                sz=$(stat -c%s "$out")
                echo "Downloaded $sz bytes"
                if [ "$sz" -gt 5000000 ] && unzip -t "$out" >/dev/null 2>&1; then
                  ok=1
                  break
                fi
              fi
            done
            if [ "$ok" != "1" ]; then
              echo "Failed to download $name"
              exit 1
            fi
            local unpack="/tmp/unpack-$name"
            rm -rf "$unpack"
            mkdir -p "$unpack"
            unzip -q "$out" -d "$unpack"
            local mdl
            mdl=$(find "$unpack" -path '*/am/final.mdl' | head -1)
            if [ -z "$mdl" ]; then
              echo "final.mdl missing"
              find "$unpack" | head -50
              exit 1
            fi
            local root
            root=$(dirname "$(dirname "$mdl")")
            local dest="android/app/src/main/assets/$name"
            rm -rf "$dest"
            mkdir -p "$dest"
            cp -a "$root"/. "$dest/"
            echo "asset-$name" > "$dest/uuid"
            test -f "$dest/am/final.mdl"
            echo "Unpacked $name OK"
            du -sh "$dest"
          }

          download_model model-fa \
            "https://alphacephei.com/vosk/models/vosk-model-small-fa-0.42.zip" \
            "https://huggingface.co/grimso/vosk-models/resolve/main/vosk-model-small-fa-0.42.zip" \
            "https://huggingface.co/localstack/vosk-models/resolve/main/vosk-model-small-fa-0.42.zip"

          download_model model-en \
            "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" \
            "https://huggingface.co/grimso/vosk-models/resolve/main/vosk-model-small-en-us-0.15.zip" \
            "https://huggingface.co/CrispyPancake/vosk-model-small-en-us-0.15/resolve/main/vosk-model-small-en-us-0.15.zip"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: offline-voice-typing-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
