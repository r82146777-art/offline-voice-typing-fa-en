name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          mkdir -p /tmp/backup
          cp -r lib pubspec.yaml README.md android_ime /tmp/backup/ 2>/dev/null || true
          rm -rf android ios linux macos windows web
          flutter create --org com.offlinevoicetyping --project-name offline_voice_typing --platforms=android .
          cp -r /tmp/backup/lib .
          cp /tmp/backup/pubspec.yaml .
          cp /tmp/backup/README.md . 2>/dev/null || true
          cp -r /tmp/backup/android_ime . 2>/dev/null || true

      - name: Inject IME and permissions
        run: |
          set -e
          PKG_DIR=android/app/src/main/kotlin/com/offlinevoicetyping/offline_voice_typing
          mkdir -p "$PKG_DIR" android/app/src/main/res/layout android/app/src/main/res/xml
          cp android_ime/VoiceTypingIME.kt "$PKG_DIR/"
          cp android_ime/ime_keyboard.xml android/app/src/main/res/layout/
          cp android_ime/method.xml android/app/src/main/res/xml/
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q RECORD_AUDIO "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          if ! grep -q VoiceTypingIME "$MANIFEST"; then
            python3 -c "
from pathlib import Path
p=Path('android/app/src/main/AndroidManifest.xml')
t=p.read_text()
s='''
        <service android:name=\".VoiceTypingIME\" android:label=\"تایپ صوتی آفلاین\" android:permission=\"android.permission.BIND_INPUT_METHOD\" android:exported=\"true\">
            <intent-filter><action android:name=\"android.view.InputMethod\" /></intent-filter>
            <meta-data android:name=\"android.view.im\" android:resource=\"@xml/method\" />
        </service>
'''
p.write_text(t.replace('</application>', s+'\n    </application>'))
"
          fi

      - name: Download Vosk models
        run: |
          mkdir -p assets/models
          curl -L --retry 5 -o assets/models/vosk-model-small-fa-0.42.zip \
            https://huggingface.co/localstack/vosk-models/resolve/main/vosk-model-small-fa-0.42.zip
          curl -L --retry 5 -o assets/models/vosk-model-small-en-us-0.15.zip \
            https://huggingface.co/localstack/vosk-models/resolve/main/vosk-model-small-en-us-0.15.zip
          ls -lh assets/models/

      - name: Flutter pub get
        run: flutter pub get

      - name: Fix vosk_flutter namespace
        run: |
          set -e
          for f in $(find "$HOME/.pub-cache" -path '*vosk_flutter*/android/build.gradle' 2>/dev/null); do
            echo "Found $f"
            if ! grep -q namespace "$f"; then
              sed -i '/android {/a\    namespace "org.vosk.vosk_flutter"' "$f"
            fi
            sed -i 's/compileSdkVersion [0-9][0-9]*/compileSdkVersion 34/' "$f" || true
            echo "--- patched ---"
            head -40 "$f"
          done

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: offline-voice-typing-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
