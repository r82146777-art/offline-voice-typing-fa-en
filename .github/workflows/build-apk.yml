name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Flutter project structure if needed
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.offlinevoicetyping --project-name offline_voice_typing .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-voice-typing-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Offline Voice Typing v0.1.${{ github.run_number }}
          body: |
            نسخه ساخته‌شده با GitHub Actions

            ### ویژگی‌ها:
            - دانلود خودکار مدل‌های Vosk (فارسی + انگلیسی)
            - رابط کاربری دسترسی‌پذیر برای نابینایان و افراد بینا
            - سوئیچ زبان فارسی / انگلیسی
            - کاملاً آفلاین بعد از دانلود اولیه مدل‌ها

            **توجه:** تشخیص گفتار واقعی هنوز به موتور Vosk وصل نشده و فعلاً متن نمونه نمایش می‌دهد. بعد از تست بازخورد بدهید تا کامل شود.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
