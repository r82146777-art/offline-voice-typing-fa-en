name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          set -e
          mkdir -p /tmp/backup
          cp -r lib pubspec.yaml README.md android_ime /tmp/backup/ 2>/dev/null || true
          rm -rf android ios linux macos windows web
          flutter create --org com.offlinevoicetyping --project-name offline_voice_typing --platforms=android .
          cp -r /tmp/backup/lib .
          cp /tmp/backup/pubspec.yaml .
          cp /tmp/backup/README.md . 2>/dev/null || true
          cp -r /tmp/backup/android_ime . 2>/dev/null || true

      - name: Inject Sherpa-ONNX native engine and Android IME
        run: |
          set -e
          PKG=android/app/src/main/kotlin/com/offlinevoicetyping/offline_voice_typing
          mkdir -p "$PKG" android/app/src/main/res/layout android/app/src/main/res/xml android/app/libs
          cp android_ime/VoskEngine.kt "$PKG/"
          cp android_ime/MainActivity.kt "$PKG/"
          cp android_ime/VoiceTypingIME.kt "$PKG/"
          cp android_ime/ime_keyboard.xml android/app/src/main/res/layout/
          cp android_ime/method.xml android/app/src/main/res/xml/

          curl -fL --retry 5 --retry-delay 3 \
            -o android/app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          test -s android/app/libs/sherpa-onnx.aar

          python3 <<'PY'
          from pathlib import Path

          mpath = Path("android/app/src/main/AndroidManifest.xml")
          text = mpath.read_text()
          if "RECORD_AUDIO" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1,
              )
          if 'android:largeHeap' not in text:
              text = text.replace(
                  "<application",
                  '<application android:largeHeap="true" android:extractNativeLibs="true" ',
                  1,
              )
          if "VoiceTypingIME" not in text:
              service = '''
                  <service
                      android:name=".VoiceTypingIME"
                      android:label="Offline Voice Typing"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              '''
              text = text.replace("</application>", service + "\n    </application>")
          mpath.write_text(text)

          for name in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              gpath = Path(name)
              if not gpath.exists():
                  continue
              g = gpath.read_text()
              if "sherpa-onnx.aar" not in g:
                  g = g.replace(
                      "dependencies {",
                      'dependencies {\n    implementation files("libs/sherpa-onnx.aar")',
                      1,
                  ) if name.endswith(".gradle") else g.replace(
                      "dependencies {",
                      'dependencies {\n    implementation(files("libs/sherpa-onnx.aar"))',
                      1,
                  )
              if "useLegacyPackaging" not in g:
                  if name.endswith(".kts"):
                      g = g.replace(
                          "android {",
                          "android {\n    packaging { jniLibs { useLegacyPackaging = true } }",
                          1,
                      )
                  else:
                      g = g.replace(
                          "android {",
                          "android {\n    packagingOptions { jniLibs { useLegacyPackaging true } }",
                          1,
                      )
              gpath.write_text(g)
              print("Updated", name)
          PY

      - name: Download high-accuracy offline ASR models
        run: |
          set -e
          mkdir -p android/app/src/main/assets/fa android/app/src/main/assets/en

          # Persian: Shenava Rizeh v1.0 sherpa-onnx CTC export.
          # It is much lighter than the 459 MB Koochik export while being
          # substantially stronger than the old Vosk small Persian model.
          curl -fL --retry 5 --retry-delay 3 \
            -o android/app/src/main/assets/fa/model.onnx \
            https://huggingface.co/Reza2kn/Shenava-Rizeh-v1.0-sherpa-onnx/resolve/main/model.onnx
          curl -fL --retry 5 --retry-delay 3 \
            -o android/app/src/main/assets/fa/tokens.txt \
            https://huggingface.co/Reza2kn/Shenava-Rizeh-v1.0-sherpa-onnx/resolve/main/tokens.txt

          # English: Whisper base multilingual INT8, also handles multilingual
          # speech and is substantially stronger than Vosk small English.
          curl -fL --retry 5 --retry-delay 3 \
            -o android/app/src/main/assets/en/base-encoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-base/resolve/main/base-encoder.int8.onnx
          curl -fL --retry 5 --retry-delay 3 \
            -o android/app/src/main/assets/en/base-decoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-base/resolve/main/base-decoder.int8.onnx
          curl -fL --retry 5 --retry-delay 3 \
            -o android/app/src/main/assets/en/base-tokens.txt \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-base/resolve/main/base-tokens.txt

          test -s android/app/src/main/assets/fa/model.onnx
          test -s android/app/src/main/assets/fa/tokens.txt
          test -s android/app/src/main/assets/en/base-encoder.int8.onnx
          test -s android/app/src/main/assets/en/base-decoder.int8.onnx
          test -s android/app/src/main/assets/en/base-tokens.txt
          du -sh android/app/src/main/assets

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: offline-voice-typing-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
