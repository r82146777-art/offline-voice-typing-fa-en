name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          mkdir -p /tmp/backup
          cp -r lib pubspec.yaml README.md android_ime /tmp/backup/ 2>/dev/null || true
          rm -rf android ios linux macos windows web
          flutter create --org com.offlinevoicetyping --project-name offline_voice_typing --platforms=android .
          cp -r /tmp/backup/lib .
          cp /tmp/backup/pubspec.yaml .
          cp /tmp/backup/README.md . 2>/dev/null || true
          cp -r /tmp/backup/android_ime . 2>/dev/null || true

      - name: Inject native code and permissions
        run: |
          set -e
          PKG=android/app/src/main/kotlin/com/offlinevoicetyping/offline_voice_typing
          mkdir -p "$PKG" android/app/src/main/res/layout android/app/src/main/res/xml
          cp android_ime/VoskEngine.kt "$PKG/"
          cp android_ime/MainActivity.kt "$PKG/"
          cp android_ime/VoiceTypingIME.kt "$PKG/"
          cp android_ime/ime_keyboard.xml android/app/src/main/res/layout/
          cp android_ime/method.xml android/app/src/main/res/xml/

          python3 <<'PY'
          from pathlib import Path

          # Manifest
          mpath = Path("android/app/src/main/AndroidManifest.xml")
          text = mpath.read_text()
          if "RECORD_AUDIO" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1,
              )
          if "VoiceTypingIME" not in text:
              service = '''
                  <service
                      android:name=".VoiceTypingIME"
                      android:label="Offline Voice Typing"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              '''
              text = text.replace("</application>", service + "\n    </application>")
          mpath.write_text(text)

          # Gradle dependency
          gpath = Path("android/app/build.gradle")
          g = gpath.read_text()
          if "vosk-android" not in g:
              g = g.replace(
                  "dependencies {",
                  'dependencies {\n    implementation "com.alphacephei:vosk-android:0.3.70"',
                  1,
              )
          gpath.write_text(g)
          print("Gradle and manifest updated")
          PY

      - name: Download Vosk models
        run: |
          mkdir -p assets/models
          curl -L --retry 5 -o assets/models/vosk-model-small-fa-0.42.zip \
            https://huggingface.co/localstack/vosk-models/resolve/main/vosk-model-small-fa-0.42.zip
          curl -L --retry 5 -o assets/models/vosk-model-small-en-us-0.15.zip \
            https://huggingface.co/localstack/vosk-models/resolve/main/vosk-model-small-en-us-0.15.zip
          ls -lh assets/models/

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: offline-voice-typing-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
